name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# A newer push supersedes an older release run on the same branch. Two runs that execute
# semantic-release at the same time race for the same version tag, which fails one of them
# with "git tag ... exit code 128" and leaves an orphan tag behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          # semantic-release pushes tags/commits with the token passed via env,
          # so the checkout must not persist its own credentials
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up NodeJs
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        uses: cycjimmy/semantic-release-action@v5
        id: release
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@7
            @semantic-release/git@10
            @saithodev/semantic-release-backmerge@4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
